# Aethernet admin site: aethernet-admin.ubifaethernet.workers.dev, behind Cloudflare Access.
# Same database as the Waymark Worker; the admin routes are shared (worker/src/index.js adminApi).
name = "aethernet-admin"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "aethernet-waymark"
database_id = "59394e23-6903-4b1b-bb41-43abf19f3915"

# The work order tracker's database (tracker-worker/). Same id as in tracker-worker/wrangler.toml once created.
[[d1_databases]]
binding = "TR"
database_name = "aethernet-tracker"
database_id = "08abe72b-5ba4-4934-8013-1f8b6b1a8825"

# Served to the page as text: the tracker's encryption (shared with Aethernet) and the passphrase word list (EFF large list).
[[rules]]
type = "Text"
globs = ["**/*.txt", "**/tracker-ui.js", "**/metrics-ui.js", "**/rules-ui.js", "**/retrace-ui.js", "**/crypto.js"]
fallthrough = true

[vars]
# People who may do the tracker's first setup (create the master key).
TRACKER_OWNERS = "green.trimar@gmail.com"
# Cloudflare Access (Zero Trust). Until both are set, every request is refused.
# TEAM_DOMAIN: "<team>.cloudflareaccess.com"; POLICY_AUD: the Access application's Audience (AUD) tag.
TEAM_DOMAIN = "ancient-river-3aec.cloudflareaccess.com"
POLICY_AUD = "051b24b27e2ddebd6df2b54471ea5fbecfe972925d33421f0c2b632ef74e6115"
