# Aethernet work order tracker → aethernet-tracker.ubifaethernet.workers.dev
# Stores' browsers send work orders here; the admin site (admin-worker/) reads them behind Cloudflare Access.
name = "aethernet-tracker"
main = "src/index.js"
compatibility_date = "2026-09-01"

# The tracker's own database (created Oct 12, 2026; tables from schema.sql).
[[d1_databases]]
binding = "TR"
database_name = "aethernet-tracker"
database_id = "08abe72b-5ba4-4934-8013-1f8b6b1a8825"

# Waymark's database, read only for store_access (same access list as every other Aethernet call).
[[d1_databases]]
binding = "AE"
database_name = "aethernet-waymark"
database_id = "59394e23-6903-4b1b-bb41-43abf19f3915"

# Cold storage for data older than 6 months (needs R2 on the account). Until it's bound, nothing is trimmed.
# [[r2_buckets]]
# binding = "ARCHIVE"
# bucket_name = "aethernet-tracker-archive"

[vars]
APP_KEY = "ae_QFa2DKDy0DrlBd_A3bfZL3BtgM51idh6"   # public: ships inside Aethernet
# People who may do the first setup (create the master key) on the admin site.
TRACKER_OWNERS = "green.trimar@gmail.com"

# Daily: trim/archive data older than 6 months.
[triggers]
crons = ["30 9 * * *"]

[[ratelimits]]
name = "LIMITER"
namespace_id = "1003"
simple = { limit = 240, period = 60 }
